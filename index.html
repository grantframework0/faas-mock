<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AWS Marketplace -> CloudFormation Deploy Mock</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --aws-navy: #232f3e;
  --aws-orange: #ff9900;
  --aws-blue: #0073bb;
  --aws-bg: #f2f3f3;
  --aws-panel: #ffffff;
  --aws-text: #16191f;
  --aws-muted: #687078;
  --aws-border: #d5dbdb;
  --ok: #1d8102;
}

body {
  font-family: -apple-system, "Amazon Ember", "Segoe UI", sans-serif;
  background: var(--aws-bg);
  color: var(--aws-text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.workspace {
  width: min(1280px, 100% - 20px);
  margin: 16px auto;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.left-rail {
  width: 250px;
  background: #fff;
  border: 1px solid #e4e7e7;
  border-radius: 6px;
  padding: 12px;
  position: sticky;
  top: 12px;
}

.rail-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--aws-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 8px;
}

.app-btn {
  width: 100%;
  text-align: left;
  height: auto;
  border: 1px solid #d5dbdb;
  border-radius: 6px;
  background: #fff;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
}

.app-btn.active {
  border-color: var(--aws-blue);
  background: #f0f8ff;
  color: var(--aws-blue);
  font-weight: 700;
}

.app-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.app-sub-btn {
  width: calc(100% - 16px);
  margin-left: 16px;
  margin-top: -2px;
  margin-bottom: 8px;
  border: 1px solid #d5dbdb;
  border-radius: 6px;
  padding: 8px 10px;
  text-align: left;
  background: #fff;
  font-size: 12px;
  color: var(--aws-text);
}

.app-sub-btn.active {
  border-color: var(--aws-blue);
  background: #f0f8ff;
  color: var(--aws-blue);
  font-weight: 700;
}

.app-sub-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.app-note {
  font-size: 12px;
  color: var(--aws-muted);
  line-height: 1.4;
}

.topbar {
  height: 42px;
  background: var(--aws-navy);
  color: #d5dbdb;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 14px;
}

.logo {
  color: var(--aws-orange);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.topbar strong { color: #fff; }

.breadcrumb {
  background: #fff;
  border-bottom: 1px solid #e7e7e7;
  font-size: 13px;
  color: var(--aws-muted);
  padding: 9px 20px;
}

main {
  width: min(1080px, 100% - 32px);
  margin: 0;
  display: grid;
  gap: 14px;
  flex: 1;
}

.card {
  background: var(--aws-panel);
  border: 1px solid #e4e7e7;
  border-radius: 6px;
}

.head {
  padding: 16px 18px;
  border-bottom: 1px solid #e8eaea;
}

.title {
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 5px;
}

.sub {
  font-size: 13px;
  color: var(--aws-muted);
}

.stepper {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid #e8eaea;
}

.step {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--aws-muted);
}

.dot {
  width: 24px;
  height: 24px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  background: #eaeded;
  color: var(--aws-muted);
}

.step.active { color: var(--aws-text); font-weight: 700; }
.step.active .dot { background: var(--aws-blue); color: #fff; }
.step.done { color: var(--ok); }
.step.done .dot { background: var(--ok); color: #fff; }
.connector { width: 30px; height: 1px; background: #d5dbdb; }

.content {
  padding: 20px;
}

h2 {
  font-size: 19px;
  font-weight: 600;
  margin-bottom: 10px;
}

.small {
  color: var(--aws-muted);
  font-size: 13px;
  margin-bottom: 14px;
}

.product {
  border: 1px solid var(--aws-border);
  border-radius: 8px;
  padding: 16px;
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 14px;
}

.badge {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  background: #ff6b00;
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.product h3 {
  font-size: 18px;
  margin-bottom: 4px;
}

.meta {
  font-size: 12px;
  color: var(--aws-muted);
  margin-bottom: 12px;
}

.notice {
  background: #fff8e6;
  border: 1px solid #f0c36a;
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 13px;
}

.actions {
  margin-top: 16px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  height: 34px;
  border-radius: 4px;
  border: 1px solid #879196;
  background: #fff;
  color: var(--aws-text);
  padding: 0 16px;
  font-size: 13px;
  cursor: pointer;
}

button.primary {
  background: var(--aws-orange);
  border-color: #e48a00;
  color: #fff;
  font-weight: 700;
}

button.primary:hover { background: #e48a00; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.field {
  display: grid;
  gap: 6px;
}

.field label {
  font-size: 13px;
  font-weight: 700;
}

.field input,
.field select {
  height: 34px;
  border: 1px solid #aab7b8;
  border-radius: 4px;
  padding: 0 10px;
  font-size: 13px;
}

.field.full { grid-column: 1 / -1; }

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

.tab {
  border: 1px solid var(--aws-border);
  padding: 7px 11px;
  border-radius: 5px;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
}

.tab.active {
  border-color: var(--aws-blue);
  color: var(--aws-blue);
  font-weight: 700;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.table th,
.table td {
  border: 1px solid #e7eaea;
  text-align: left;
  padding: 9px 10px;
}

.table th {
  background: #f7f8f8;
  color: var(--aws-muted);
  font-size: 12px;
}

.ok {
  color: var(--ok);
  font-weight: 700;
}

.status-progress {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #0f5f96;
  font-weight: 600;
}

.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid #c7d2db;
  border-top-color: var(--aws-blue);
  border-radius: 999px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.out a {
  color: var(--aws-blue);
  text-decoration: none;
}

.out a:hover {
  text-decoration: underline;
}

.out {
  border: 1px solid #d5e7fb;
  background: #f5faff;
  border-radius: 6px;
  padding: 12px;
}

.out-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #dfebfb;
  padding: 7px 0;
  font-size: 13px;
}

.out-row:last-child { border-bottom: none; }

.panel {
  border: 1px solid #e4e7e7;
  border-radius: 6px;
  margin-top: 14px;
}

.panel-head {
  border-bottom: 1px solid #e8eaea;
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 700;
}

.panel-body {
  padding: 14px;
}

.hint {
  font-size: 12px;
  color: var(--aws-muted);
  margin-top: 3px;
}

.radio-line {
  display: flex;
  gap: 10px;
  margin: 10px 0;
  align-items: flex-start;
}

.radio-line label {
  font-size: 13px;
  font-weight: 700;
}

.radio-sub {
  font-size: 12px;
  color: var(--aws-muted);
  margin-top: 2px;
}

.target-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 8px 0 14px;
}

.target-tile {
  border: 1px solid #d5dbdb;
  border-radius: 6px;
  padding: 10px;
  background: #fff;
}

.target-tile.active {
  border: 2px solid var(--aws-blue);
  background: #f0f8ff;
}

.tile-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 4px;
}

.tile-sub {
  font-size: 12px;
  color: var(--aws-muted);
  line-height: 1.35;
}

.callout {
  border-left: 3px solid var(--aws-blue);
  background: #e8f4fd;
  padding: 10px 12px;
  border-radius: 0 4px 4px 0;
  font-size: 12px;
  color: #0b3f75;
  margin: 10px 0 12px;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #1d8102;
  font-weight: 700;
  background: #e8f5e9;
  border: 1px solid #b8ddb9;
  border-radius: 12px;
  padding: 2px 9px;
}

.mini-check {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: #1d8102;
}

.agentcore-frame-wrap {
  border: 1px solid #e4e7e7;
  border-radius: 6px;
  overflow: hidden;
  background: #fff;
}

.agentcore-frame {
  width: 100%;
  min-height: 980px;
  border: none;
  display: block;
}

@media (max-width: 760px) {
  .workspace { width: calc(100% - 12px); margin: 10px auto; flex-direction: column; }
  .left-rail { width: 100%; position: static; }
  main { width: 100%; }
  .grid { grid-template-columns: 1fr; }
  .target-grid { grid-template-columns: 1fr; }
  .product { grid-template-columns: 1fr; }
  .actions { justify-content: flex-start; }
}
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">aws</span>
    <span id="topbar-path">AWS Marketplace -> <strong>Teradata Fabric Universal Connector</strong></span>
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>

  <div class="workspace">
    <aside class="left-rail" id="left-rail"></aside>

    <main>
      <section class="card">
        <div class="head">
          <div class="title" id="page-title">Deploy Teradata Fabric Universal Connector</div>
          <div class="sub" id="page-sub">Mock flow: Marketplace subscription to CloudFormation deployment outputs.</div>
        </div>
        <div class="stepper" id="stepper"></div>
        <div class="content" id="content"></div>
        <div class="agentcore-frame-wrap" id="agentcore-frame-wrap" style="display:none">
          <iframe id="agentcore-frame" class="agentcore-frame" data-src=""></iframe>
        </div>
      </section>
    </main>
  </div>

<script>
let step = 1;
let activeTab = "resources";
let deployComplete = false;
let deployTimer = null;
let currentApp = "marketplace";
let subscribed = false;
let agentCoreFrameUrl = "";

const deploymentResources = [
  {
    name: "ECS cluster",
    type: "AWS::ECS::Cluster",
    physicalId: "td-universal-fabric-cluster"
  },
  {
    name: "DataSource Lambda",
    type: "AWS::Lambda::Function",
    physicalId: "td-data-source-lambda"
  },
  {
    name: "TD Universal Fabric Lambda",
    type: "AWS::Lambda::Function",
    physicalId: "td-universal-fabric-lambda"
  },
  {
    name: "Schema Step Function",
    type: "AWS::StepFunctions::StateMachine",
    physicalId: "td-schema-step-function"
  },
  {
    name: "Knowledge Base",
    type: "AWS::Bedrock::KnowledgeBase",
    physicalId: "td-enterprise-knowledge-base"
  }
];

const cfLambdaArn = "arn:aws:lambda:us-east-2:123456789012:function:td-universal-fabric-lambda";
const cfKbArn = "arn:aws:bedrock:us-east-2:123456789012:knowledge-base/td-enterprise-knowledge-base";

function adminUIUrl() {
  const returnUrl = "index.html?step=4&tab=outputs";
  return "agentcore-flow.html?admin=1&lambda=" + encodeURIComponent(cfLambdaArn) + "&kb=" + encodeURIComponent(cfKbArn) + "&return=" + encodeURIComponent(returnUrl);
}

function agentCoreUIUrl() {
  return "agentcore-flow.html?lambda=" + encodeURIComponent(cfLambdaArn) + "&kb=" + encodeURIComponent(cfKbArn);
}

const steps = [
  "AWS Marketplace",
  "CloudFormation Details",
  "Deploy",
  "Resources and Outputs"
];

function renderStepper() {
  const el = document.getElementById("stepper");
  let html = "";

  for (let i = 0; i < steps.length; i++) {
    const n = i + 1;
    const state = n < step ? "done" : (n === step ? "active" : "");
    const marker = n < step ? "\u2713" : String(n);
    html += '<div class="step ' + state + '"><span class="dot">' + marker + '</span><span>' + steps[i] + '</span></div>';
    if (i < steps.length - 1) {
      html += '<div class="connector"></div>';
    }
  }

  el.innerHTML = html;
}

function renderBreadcrumb() {
  const bc = document.getElementById("breadcrumb");
  if (currentApp === "agentcore") {
    bc.textContent = "Amazon Bedrock AgentCore > Gateways";
    return;
  }
  if (step === 1) {
    bc.textContent = "AWS Marketplace > Product Listings > Teradata Fabric Universal Connector";
  } else {
    bc.textContent = "AWS CloudFormation > Stacks > Teradata Fabric Universal Connector";
  }
}

function renderTopBar() {
  const el = document.getElementById("topbar-path");
  if (currentApp === "agentcore") {
    el.innerHTML = "Amazon Bedrock AgentCore -> <strong>Gateways</strong>";
    return;
  }
  if (step === 1) {
    el.innerHTML = "AWS Marketplace -> <strong>Teradata Fabric Universal Connector</strong>";
  } else {
    el.innerHTML = "AWS CloudFormation -> <strong>Teradata Fabric Universal Connector</strong>";
  }
}

function renderRail() {
  const rail = document.getElementById("left-rail");
  rail.innerHTML = '' +
    '<div class="rail-title">AWS Services</div>' +
    '<button class="app-btn ' + (currentApp === "marketplace" ? "active" : "") + '" onclick="switchApp(\'marketplace\')">AWS Marketplace</button>' +
    '<button class="app-btn ' + (currentApp === "cloudformation" ? "active" : "") + '" onclick="switchApp(\'cloudformation\')" ' + (subscribed ? '' : 'disabled') + '>AWS CloudFormation</button>' +
    '<button class="app-btn ' + (currentApp === "agentcore" ? "active" : "") + '" onclick="switchApp(\'agentcore\')" ' + (deployComplete ? '' : 'disabled') + '>AWS Bedrock AgentCore</button>';
}

function switchApp(app) {
  if (app === "marketplace") {
    currentApp = "marketplace";
    step = 1;
    render();
    return;
  }
  if (app === "cloudformation" && subscribed) {
    currentApp = "cloudformation";
    if (step < 2 || step > 4) {
      step = 2;
    }
    render();
    return;
  }
  if (app === "agentcore" && deployComplete) {
    openAgentCoreUI();
  }
}

function openAgentCoreUI() {
  agentCoreFrameUrl = agentCoreUIUrl();
  currentApp = "agentcore";
  render();
}

function openAdminUIEmbedded() {
  agentCoreFrameUrl = adminUIUrl();
  currentApp = "agentcore";
  render();
}

function onSubscribe() {
  subscribed = true;
  currentApp = "cloudformation";
  goStep(2);
}

function stepMarketplace() {
  return '' +
    '<h2>AWS Marketplace Product</h2>' +
    '<div class="small">Start on Marketplace with the product ready to subscribe.</div>' +
    '<div class="product">' +
      '<div class="badge">TD</div>' +
      '<div>' +
        '<h3>Teradata Fabric Universal Connector</h3>' +
        '<div class="meta">By Teradata | Version 2.4.1 | Container + CloudFormation package</div>' +
        '<p class="small">Connect AWS-hosted workloads to Teradata fabric services and deploy required infrastructure in your AWS account.</p>' +
        '<div class="notice"><strong>Status:</strong> You are not subscribed to this product yet.</div>' +
        '<div class="actions">' +
          '<button onclick="goStep(1)">Cancel</button>' +
          '<button class="primary" onclick="onSubscribe()">Subscribe</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function stepCloudFormation() {
  return '' +
    '<h2>CloudFormation Stack Configuration</h2>' +
    '<div class="small">Enter advanced details, then deploy the stack.</div>' +
    '<div class="grid">' +
      '<div class="field full"><label>Stack name</label><input value="td-fabric-universal-connector-prod"/></div>' +
      '<div class="field"><label>AWS Region</label><select><option>us-east-2 (Ohio)</option><option>us-east-1 (N. Virginia)</option></select></div>' +
      '<div class="field"><label>Instance type</label><select><option>m5.2xlarge</option><option>m5.4xlarge</option></select></div>' +
      '<div class="field"><label>VPC</label><select><option>vpc-01ab23cd (prod-vpc)</option><option>vpc-89ef01gh (shared-vpc)</option></select></div>' +
      '<div class="field"><label>Subnet</label><select><option>subnet-1133aa (private-a)</option><option>subnet-2244bb (private-b)</option></select></div>' +
      '<div class="field full"><label>Connector endpoint name</label><input value="td-fabric-endpoint-prod"/></div>' +
    '</div>' +
    '<div class="actions">' +
      '<button onclick="goStep(1)">Back</button>' +
      '<button class="primary" onclick="goStep(3)">Deploy</button>' +
    '</div>';
}

function stepDeploying() {
  const statusHtml = deployComplete
    ? '<span class="ok">Create Complete</span>'
    : '<span class="status-progress"><span class="spinner" aria-hidden="true"></span>Creating</span>';
  const rows = deploymentResources.map(function(resource) {
    return "" +
      "<tr>" +
        "<td>" + resource.name + "</td>" +
        "<td>" + resource.type + "</td>" +
        "<td>" + statusHtml + "</td>" +
      "</tr>";
  }).join("");

  return '' +
    '<h2>Deploying Stack</h2>' +
    '<div class="small">Submitting CloudFormation template and provisioning resources. Status updates automatically after 5 seconds.</div>' +
    '<table class="table">' +
      '<thead><tr><th>Resource</th><th>Resource Type</th><th>Status</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>' +
    '<div class="actions">' +
      '<button onclick="goStep(2)">Back</button>' +
      '<button class="primary" onclick="goStep(4)" ' + (deployComplete ? '' : 'disabled') + '>' + (deployComplete ? 'View Deployed Resources' : 'Deploying...') + '</button>' +
    '</div>';
}

function renderResourcesTable() {
  const rows = deploymentResources.map(function(resource) {
    return "" +
      "<tr>" +
        "<td>" + resource.name + "</td>" +
        "<td>" + resource.type + "</td>" +
        "<td>" + resource.physicalId + "</td>" +
        "<td class=\"ok\">Create Complete</td>" +
      "</tr>";
  }).join("");

  return '' +
    '<table class="table">' +
      '<thead><tr><th>Resource</th><th>Type</th><th>Physical ID</th><th>Status</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}

function renderOutputs() {
  return '' +
    '<div class="out">' +
      '<div class="out-row"><span>TDUniversalFabricLambdaArn</span><strong>' + cfLambdaArn + '</strong></div>' +
      '<div class="out-row"><span>KnowledgeBaseArn</span><strong>' + cfKbArn + '</strong></div>' +
      '<div class="out-row"><span>AdminUIEndpoint</span><strong><a href="javascript:void(0)" onclick="openAdminUIEmbedded()">Open Admin UI</a></strong></div>' +
    '</div>';
}

function stepDeployed() {
  return '' +
    '<h2>Stack Details</h2>' +
    '<div class="small">Deployment finished. Review resources or open Outputs, then use AWS Bedrock AgentCore in the left rail to continue to gateway creation.</div>' +
    '<div class="tabs">' +
      '<button class="tab ' + (activeTab === "resources" ? "active" : "") + '" onclick="setTab(\'resources\')">Resources</button>' +
      '<button class="tab ' + (activeTab === "outputs" ? "active" : "") + '" onclick="setTab(\'outputs\')">Outputs</button>' +
    '</div>' +
    (activeTab === "resources" ? renderResourcesTable() : renderOutputs());
}

function setTab(tab) {
  activeTab = tab;
  render();
}

function startDeploymentProcess() {
  deployComplete = false;
  if (deployTimer) {
    clearTimeout(deployTimer);
  }
  deployTimer = setTimeout(function() {
    deployComplete = true;
    if (step === 3 || step === 4) {
      render();
    }
  }, 5000);
}

function goStep(next) {
  step = next;
  if (step >= 2 && step <= 4) {
    currentApp = "cloudformation";
    subscribed = true;
  }
  if (step === 3) {
    startDeploymentProcess();
  }
  if (step < 4) {
    activeTab = "resources";
  }
  render();
}

function render() {
  renderTopBar();
  renderRail();
  renderStepper();
  renderBreadcrumb();

  const pageTitle = document.getElementById("page-title");
  const pageSub = document.getElementById("page-sub");
  const stepper = document.getElementById("stepper");
  const root = document.getElementById("content");
  const frameWrap = document.getElementById("agentcore-frame-wrap");

  if (currentApp === "agentcore") {
    pageTitle.textContent = "Amazon Bedrock AgentCore";
    pageSub.textContent = "Embedded AgentCore gateway creation and Admin UI experience.";
    stepper.style.display = "none";
    root.style.display = "none";
    frameWrap.style.display = "block";
    const iframe = document.getElementById("agentcore-frame");
    if (iframe.getAttribute("data-src") !== agentCoreFrameUrl) {
      iframe.setAttribute("data-src", agentCoreFrameUrl);
      iframe.src = agentCoreFrameUrl;
    }
    return;
  }

  frameWrap.style.display = "none";
  root.style.display = "";
  pageTitle.textContent = "Deploy Teradata Fabric Universal Connector";
  pageSub.textContent = "Mock flow: Marketplace subscription to CloudFormation deployment outputs.";
  stepper.style.display = "flex";

  if (step === 1) root.innerHTML = stepMarketplace();
  if (step === 2) root.innerHTML = stepCloudFormation();
  if (step === 3) root.innerHTML = stepDeploying();
  if (step === 4) root.innerHTML = stepDeployed();
}

window.addEventListener("message", function(e) {
  if (e.data && e.data.type === "agentcore-close") {
    currentApp = "cloudformation";
    step = 4;
    activeTab = "outputs";
    render();
  }
});

(function initFromReturnUrl() {
  const params = new URLSearchParams(window.location.search);
  if (parseInt(params.get("step"), 10) === 4) {
    subscribed = true;
    deployComplete = true;
    currentApp = "cloudformation";
    step = 4;
    const qTab = params.get("tab");
    if (qTab === "outputs" || qTab === "resources") activeTab = qTab;
  }
})();

render();
</script>
</body>
</html>
